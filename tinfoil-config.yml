cvm-version: 0.12.0
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "glm-5-3-flash"
    repo: "RedHatAI/GLM-5.3-Flash-NVFP4@36c184c6cda000a481711306df5adde42f63321a"
    mpk: "bb9acee3efcdc5e6cdbbe936a16955896a42687b9bbb7ed04ae5ba0fce1523eb_197881163776_f21029cd-3ef4-5893-9fa5-46933aae8a34"

containers:
  - name: "glm-5-3-flash"
    image: "ghcr.io/tinfoilsh/confidential-glm5-3-flash@sha256:2e99f4473449fd3ca16574d20398bb230a5bc6a04a4c0d4d9c0f7611877afdbd" # v0.0.4
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
      - RUNAI_STREAMER_CONCURRENCY: "8"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ALLREDUCE_USE_FLASHINFER: "0"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-bb9acee3efcdc5e6cdbbe936a16955896a42687b9bbb7ed04ae5ba0fce1523eb",
        "--kv-cache-dtype",
        "fp8",
        "--tensor-parallel-size",
        "8",
        "--tool-call-parser",
        "glm47",
        "--enable-auto-tool-choice",
        "--enable-prompt-tokens-details",
        "--reasoning-parser",
        "glm45",
        "--served-model-name",
        "glm-5-3-flash",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--load-format",
        "runai_streamer",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "1048576",
        "--max-num-seqs",
        "32",
        "--speculative-config",
        '{"method":"mtp","num_speculative_tokens":5}',
      ]
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
