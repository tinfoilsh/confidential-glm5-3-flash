cvm-version: 0.12.0
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "glm-5-3-flash"
    repo: "RedHatAI/GLM-5.3-Flash-NVFP4@240131d6a447c8d89acd428c5ddfc85598651744"
    mpk: "e846c8dd82fca17e72c841ae739ae913b6c4c276feab082f1dd9f1f7f39f1472_197881163776_b94b6898-045a-59de-b1cc-571c56d2a940"
    schema: 2

containers:
  - name: "glm-5-3-flash"
    image: "ghcr.io/tinfoilsh/confidential-glm5-3-flash@sha256:37b5972bc6446007af6e56c9aef778c4affcf7b4034e33b0c0873cfe55e5d18d" # v0.0.7
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
      - RUNAI_STREAMER_CONCURRENCY: "8"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ALLREDUCE_USE_FLASHINFER: "0"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-e846c8dd82fca17e72c841ae739ae913b6c4c276feab082f1dd9f1f7f39f1472",
        "--kv-cache-dtype",
        "fp8",
        "--tensor-parallel-size",
        "8",
        "--tool-call-parser",
        "glm47",
        "--enable-auto-tool-choice",
        "--enable-prompt-tokens-details",
        "--reasoning-parser",
        "glm45",
        "--served-model-name",
        "glm-5-3-flash",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--load-format",
        "runai_streamer",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "1048576",
        "--max-num-seqs",
        "32",
        "--speculative-config",
        '{"method":"mtp","num_speculative_tokens":5}',
        # RedHatAI/GLM-5.3-Flash-NVFP4 ships a generation_config.json with
        # temperature 1.0 but no top_p (upstream zai-org has top_p 0.95), so
        # vLLM defaulted to top_p 1.0. With NVFP4 that samples stray
        # Chinese/Cyrillic/Arabic/Greek tokens into Italian and English output
        # (~8 per 10k tokens in long-document runs; 0 with top_p 0.95).
        "--override-generation-config",
        '{"top_p":0.95}',
      ]
    tmpfs:
      /tmp: size=16g,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
